name: AI command receipt

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  acknowledge:
    if: github.actor == github.repository_owner && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const {acknowledge} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/receipt.cjs');
            await acknowledge({github, context});

name: AI issue planner controller tests

on:
  pull_request:
    paths:
      - "scripts/issue_bot.py"
      - "tests/test_issue_bot.py"
      - ".opencode/agents/issue-planner.md"
      - ".github/workflows/opencode-issue-planner.yml"
      - ".github/workflows/opencode-labels.yml"
      - ".github/workflows/ai-issue-planner-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install minimal test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Run controller tests
        run: python -m pytest tests/test_issue_bot.py -q -o addopts=
      - name: Check controller Python syntax
        run: python -m py_compile scripts/issue_bot.py

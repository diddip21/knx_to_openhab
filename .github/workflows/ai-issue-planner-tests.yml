name: AI issue planner controller tests

on:
  pull_request:
    paths:
      - "scripts/issue_bot.py"
      - "scripts/automation/model_response.py"
      - "scripts/automation/planner_runner.py"
      - "scripts/automation/planning.cjs"
      - "scripts/automation/approval.py"
      - "scripts/automation/scope.py"
      - "scripts/opencode_model_router.py"
      - "tests/test_issue_bot.py"
      - "tests/test_ai_planner_runner.py"
      - "tests/ai_pipeline/planning_freshness.test.cjs"
      - ".opencode/agents/issue-planner.md"
      - ".github/opencode-cli-version"
      - ".github/workflows/opencode-issue-planner.yml"
      - ".github/workflows/opencode-labels.yml"
      - ".github/workflows/ai-issue-planner-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install minimal test dependency
        run: python -m pip install "pytest>=8,<10"
      - name: Run controller tests
        run: python -m pytest tests/test_issue_bot.py tests/test_ai_planner_runner.py -q -o addopts=
      - name: Reject stale concurrent planning results
        run: node --test tests/ai_pipeline/planning_freshness.test.cjs
      - name: Check controller Python syntax
        run: python -m compileall -q scripts/issue_bot.py scripts/automation

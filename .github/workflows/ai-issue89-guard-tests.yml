name: Approved HomeKit issue 89 implementation guard tests

on:
  pull_request:
    paths:
      - ".github/workflows/opencode-issue89-implement.yml"
      - ".github/workflows/ai-issue89-guard-tests.yml"
      - ".opencode/agents/issue89-implementer.md"
      - "scripts/issue_impl.py"
      - "scripts/issue89_impl.py"
      - "tests/test_issue89_impl.py"
      - "docs/OPENCODE_ISSUE89_IMPLEMENTATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"
      - name: Test approval binding and file whitelist
        run: python -m pytest tests/test_issue89_impl.py tests/test_issue_impl.py -q -o addopts=
      - name: Compile trusted validators
        run: python -m py_compile scripts/issue_impl.py scripts/issue89_impl.py

name: Unpublished planner research replay

on:
  workflow_call:
    inputs:
      issue_number:
        required: true
        type: string
    secrets:
      OPENROUTER_API_KEY:
        required: false
  pull_request:
    paths:
      - "scripts/automation/planner*.py"
      - "scripts/automation/research.cjs"
      - "scripts/automation/planning.cjs"
      - "scripts/issue_bot.py"
      - ".github/workflows/ai-planner-live-tests.yml"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: private-planner-${{ github.event.pull_request.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  replay:
    # PR replays are secret-free; only explicit owner dispatch may use the provider key.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, '<!-- ai-planner-diagnostic:'))
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read issue and versioned research sources without modifying GitHub
        uses: actions/github-script@v9
        env:
          DIAGNOSTIC_ISSUE: ${{ inputs.issue_number }}
        with:
          script: |
            const fs = require('node:fs');
            const matches = [...(context.payload.pull_request?.body || '').matchAll(/^<!-- ai-planner-diagnostic: ([1-9][0-9]*) -->$/gm)];
            if (!process.env.DIAGNOSTIC_ISSUE && matches.length !== 1) throw new Error('Exactly one owner diagnostic target is required');
            const number = Number(process.env.DIAGNOSTIC_ISSUE || matches[0][1]);
            if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Invalid issue number');
            const repo = {...context.repo, issue_number: number};
            const {data: issue} = await github.rest.issues.get(repo);
            const comments = await github.paginate(github.rest.issues.listComments, {...repo, per_page: 100});
            const {planningContext} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/planning.cjs');
            const related = await planningContext({github,
              context: {repo: context.repo, issue: {number}},
              evidenceDirectory: process.env.GITHUB_WORKSPACE + '/.planner-evidence'});
            fs.writeFileSync(process.env.RUNNER_TEMP + '/planning-context.json', JSON.stringify(related));
            fs.writeFileSync(process.env.RUNNER_TEMP + '/planner-diagnostic-source.json',
              JSON.stringify({issue, comments, owner: context.repo.owner}));
      - name: Prepare production-equivalent private prompt
        run: python -I scripts/automation/planner_diagnostic.py prepare
      - name: Install pinned OpenCode
        run: npm install --global "@opencode/cli@$(cat .github/opencode-cli-version)"
      - name: Select an approved working free model
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/planner-data
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
        run: python scripts/opencode_model_router.py select --task plan --report "$RUNNER_TEMP/model-router.json"
      - name: Prove real interruption and same-session continuation
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/planner-data
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.OPENROUTER_API_KEY || '' }}
        run: python -I scripts/automation/planner_diagnostic.py run
      - name: Retain content-free diagnostics only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unpublished-planner-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/planner-diagnostics.json
            ${{ runner.temp }}/model-router.json
          if-no-files-found: ignore
          retention-days: 7

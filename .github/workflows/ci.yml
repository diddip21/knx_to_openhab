name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run core tests
        run: |
          # The maintenance-lock policy requires root-owned ancestors. The core suite
          # uses pytest temporary paths for lock fixtures, so run it as root rather
          # than weakening that production guard for the unprivileged runner.
          sudo -n env "PATH=$PATH" "$(command -v pytest)" \
            -q --cov=. --cov-report=xml -m "not ui" --ignore=tests/ui

      - name: Run unprivileged filesystem tests
        run: |
          pytest -q \
            tests/test_openhab_yaml.py::test_write_yaml_updates_preprovisioned_file_without_writable_parent \
            tests/test_openhab_yaml.py::test_write_yaml_refuses_hard_linked_target_without_writable_parent

  lint:
    name: Lint (format + typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Black (check)
        run: |
          black --check . --diff

      - name: Isort (check)
        run: |
          isort --check-only .

      - name: Flake8
        run: |
          flake8 .

      - name: Mypy
        run: |
          mypy .

  ui-tests:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os}}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Setup test environment
        run: |
          # Create required directories
          mkdir -p var/lib/knx_to_openhab
          mkdir -p var/backups/knx_to_openhab
          mkdir -p openhab/items openhab/things openhab/sitemaps openhab/rules openhab/persistence openhab/transform

          # Disable auth for tests using dedicated script
          python tests/ui/setup_test_env.py

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps

      - name: Run UI tests
        run: |
          pytest tests/ui/ -v -m ui --tb=short

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-and-reports
          path: test-results/
          if-no-files-found: ignore

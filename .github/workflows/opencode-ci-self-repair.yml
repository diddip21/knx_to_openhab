name: OpenCode CI self-repair (approved issue 89)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: ai-ci-repair-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'ai/issue-89-plan-v2-run-')
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout trusted default-branch scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout exact failing commit without writing credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false

      - name: Fetch live PR, issue, approval and commit history (read only)
        uses: actions/github-script@v9
        env:
          OUT: ${{ runner.temp }}
        with:
          script: |
            const fs = require('node:fs');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const branch = context.payload.workflow_run.head_branch;
            const {data: issue} = await github.rest.issues.get({...repo, issue_number:89});
            const comments = await github.paginate(
              github.rest.issues.listComments, {...repo, issue_number:89, per_page:100}
            );
            const {data: open} = await github.rest.pulls.list({
              ...repo, state:'open', head:`${repo.owner}:${branch}`, per_page:100
            });
            const pr = open.find(p => p.head.ref === branch && p.base.ref === 'dev');
            if (!pr) throw new Error('No matching approved Draft PR');
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {...repo, pull_number:pr.number, per_page:100}
            );
            fs.writeFileSync(process.env.OUT + '/repair-source.json',
              JSON.stringify({issue,comments,pr,commits}));

      - name: Retrieve failed CI logs as untrusted diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          timeout 40s gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$RUNNER_TEMP/ci-failed.log" || true

      - name: Revalidate owner and plan; prepare bounded repair prompt
        working-directory: candidate
        shell: bash
        run: python ../trusted/scripts/ci_repair.py prepare

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install OpenCode without provider API keys
        run: npm install --global "@opencode/cli@$(cat trusted/.github/opencode-cli-version)"

      - name: Pick a working approved free model using read-only probes
        id: model
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python ../trusted/scripts/opencode_model_router.py select --task implement --report "$RUNNER_TEMP/ci-repair-model.json"

      - name: Load trusted restricted agent into disposable candidate workspace
        shell: bash
        run: cp trusted/.opencode/agents/issue89-ci-repair.md candidate/.opencode/agents/issue89-ci-repair.md

      - name: Ask OpenCode to fix only existing issue89 files
        working-directory: candidate
        shell: bash
        env:
          CI: "true"
          MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 750s \
            opencode run --standalone --archived --format json \
              --agent issue89-ci-repair --model "$MODEL" \
              "$(cat "$RUNNER_TEMP/repair-prompt.txt")" \
            < /dev/null > "$RUNNER_TEMP/ci-repair-events.jsonl" \
            2> "$RUNNER_TEMP/ci-repair-stderr.log"

      - name: Remove trusted temporary agent; validate exact repair diff
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          # New dev-based candidates already track this policy after #109.
          # Restore their original file; deleting it would fail our own scope guard.
          if git ls-files --error-unmatch -- .opencode/agents/issue89-ci-repair.md >/dev/null 2>&1; then
            git restore --source=HEAD --worktree -- .opencode/agents/issue89-ci-repair.md
          else
            rm -- .opencode/agents/issue89-ci-repair.md
          fi
          python ../trusted/scripts/ci_repair.py collect

      - name: Upload bounded, validated repair artifact
        uses: actions/upload-artifact@v7
        with:
          name: issue89-ci-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-artifact.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: repair
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only trusted main for validator and GitHub API calls
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download validated repair artifact
        uses: actions/download-artifact@v8
        with:
          name: issue89-ci-repair-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Refresh live PR, issue, owner approval and commits
        uses: actions/github-script@v9
        env:
          OUT: ${{ runner.temp }}
        with:
          script: |
            const fs = require('node:fs');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const branch = context.payload.workflow_run.head_branch;
            const {data: issue} = await github.rest.issues.get({...repo, issue_number:89});
            const comments = await github.paginate(
              github.rest.issues.listComments, {...repo, issue_number:89, per_page:100}
            );
            const {data: open} = await github.rest.pulls.list({
              ...repo, state:'open', head:`${repo.owner}:${branch}`, per_page:100
            });
            const pr = open.find(p => p.head.ref === branch && p.base.ref === 'dev');
            if (!pr) throw new Error('Matching Draft PR disappeared');
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {...repo, pull_number:pr.number, per_page:100}
            );
            fs.writeFileSync(process.env.OUT + '/repair-source.json',
              JSON.stringify({issue,comments,pr,commits}));

      - name: Validate unchanged approval, PR head, attempt number and artifact
        run: python scripts/ci_repair.py recheck

      - name: Publish only checked source files; dispatch existing CI
        uses: actions/github-script@v9
        env:
          ARTIFACT: ${{ runner.temp }}/repair-artifact.json
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const item = JSON.parse(fs.readFileSync(process.env.ARTIFACT,'utf8'));
            const repo = {owner:context.repo.owner,repo:context.repo.repo};
            const expected = context.payload.workflow_run;
            if (item.issue_number !== 89 || item.version !== 2 ||
                item.branch !== expected.head_branch || item.head_sha !== expected.head_sha ||
                ![1,2].includes(item.attempt)) {
              core.setFailed('Invalid approval or attempt metadata');
              return;
            }
            const {data: ref} = await github.rest.git.getRef({
              ...repo, ref:`heads/${item.branch}`
            });
            if (ref.object.sha !== item.head_sha) {
              core.setFailed('PR head moved before repair publication');
              return;
            }
            const {data: currentPr} = await github.rest.pulls.get({
              ...repo, pull_number:item.pr_number
            });
            if (currentPr.state !== 'open' || !currentPr.draft ||
                currentPr.user.login !== 'github-actions[bot]' ||
                currentPr.head.sha !== item.head_sha ||
                currentPr.head.ref !== item.branch || currentPr.base.ref !== 'dev') {
              core.setFailed('Draft PR changed during repair');
              return;
            }
            const allowed = new Set([
              'config.json','knxproject_to_openhab.py','ets_to_openhab.py',
              'web_ui/backend/jobs.py','web_ui/backend/project_preview.py',
              'web_ui/backend/app.py','web_ui/templates/index.html',
              'web_ui/static/app.js','web_ui/static/i18n.js','web_ui/api_schema.json',
              'tests/test_rollershutter_homekit_extents.py',
              'tests/test_homekit_config_override.py',
              'tests/ui/test_homekit_settings.py','docs/USER_GUIDE.md',
              'README.md','CHANGELOG.md'
            ]);
            const paths = item.files.map(f=>f.path);
            if (!paths.length || paths.length > 12 ||
                new Set(paths).size !== paths.length ||
                !paths.every(p=>allowed.has(p))) {
              core.setFailed('Unauthorized repair paths');
              return;
            }
            const treeEntries = [];
            for (const file of item.files) {
              const bytes = Buffer.from(file.content_b64,'base64');
              if (bytes.length > 300000 || !bytes.length ||
                  crypto.createHash('sha256').update(bytes).digest('hex') !== file.sha256) {
                core.setFailed('Repair artifact failed independent digest check');
                return;
              }
              const {data: blob} = await github.rest.git.createBlob({
                ...repo, content:file.content_b64, encoding:'base64'
              });
              treeEntries.push({path:file.path, mode:'100644', type:'blob', sha:blob.sha});
            }
            const {data: baseCommit} = await github.rest.git.getCommit({
              ...repo, commit_sha:item.head_sha
            });
            const {data: tree} = await github.rest.git.createTree({
              ...repo, base_tree:baseCommit.tree.sha, tree:treeEntries
            });
            const {data: commit} = await github.rest.git.createCommit({
              ...repo,
              message:`fix(ai-ci): issue89 attempt ${item.attempt}`,
              tree:tree.sha,parents:[item.head_sha]
            });
            // Fast-forward only; no force push or merge into dev/main.
            await github.rest.git.updateRef({
              ...repo, ref:`heads/${item.branch}`, sha:commit.sha, force:false
            });
            core.info(`Published bounded repair ${item.attempt}/2 to ${item.branch}`);
            core.summary.addRaw(
              `Published repair ${item.attempt}/2 to PR #${item.pr_number}.\n`
            ).write();
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id:'ci.yml', ref:item.branch
            });
            core.info('Triggered fresh full CI; no auto merge');

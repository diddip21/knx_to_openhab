name: AI CI self-repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}
concurrency:
  group: ai-ci-repair-${{ github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'ai/issue-')
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Read exact failing source without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Require trusted runtime policy and unchanged CI
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.opencode)" = "$(git -C ../trusted rev-parse HEAD:.opencode)"
          for file in opencode.json opencode.jsonc .github/workflows/ci.yml; do
            if test -e "../trusted/$file" || test -e "$file"; then
              cmp -s "../trusted/$file" "$file"
            fi
          done
      - name: Fetch actual run, PR and live authorization
        uses: actions/github-script@v9
        with:
          script: |
            const task = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/github.cjs');
            await task.fetchSource({github, context, directory:process.env.RUNNER_TEMP, mode:'repair'});
      - name: Read failed logs as untrusted diagnostic text
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          timeout 40s gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$RUNNER_TEMP/ci-failed.log" || true
      - name: Revalidate task, failing SHA, draft state and remaining repair budget
        working-directory: candidate
        run: python -I ../trusted/scripts/ci_repair.py prepare
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned OpenCode
        run: npm install --global "@opencode/cli@$(cat trusted/.github/opencode-cli-version)"
      - name: Select approved free model
        id: model
        working-directory: candidate
        run: python ../trusted/scripts/opencode_model_router.py select --task implement --report "$RUNNER_TEMP/model.json"
      - name: Load literal permissions for existing approved files only
        working-directory: candidate
        run: python -I ../trusted/scripts/ci_repair.py agent
      - name: Generate bounded repair without GitHub credentials
        working-directory: candidate
        env:
          CI: "true"
          MODEL: ${{ steps.model.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 750s \
            opencode run --standalone --archived --format json \
            --agent ai-task --model "$MODEL" "$(cat "$RUNNER_TEMP/task-prompt.txt")" \
            < /dev/null > "$RUNNER_TEMP/task-events.jsonl" 2> "$RUNNER_TEMP/task-stderr.log"
      - name: Restore runtime agent and validate repair
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- .opencode/agents/ai-task.md
          python -m pip install "black==26.10.1" "isort==9.0.2"
          python -I ../trusted/scripts/ci_repair.py format
          python -I ../trusted/scripts/ci_repair.py collect
      - uses: actions/upload-artifact@v7
        with:
          name: ai-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task-artifact.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: repair
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Read failing Git objects only; never execute candidate code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ai-task-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Refresh actual run, current PR and live approval
        uses: actions/github-script@v9
        with:
          script: |
            const task = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/github.cjs');
            await task.fetchSource({github, context, directory:process.env.RUNNER_TEMP, mode:'repair'});
      - name: Independently validate content, scope, SHA and attempt
        working-directory: target
        run: python -I ../trusted/scripts/ci_repair.py recheck
      - name: Fast-forward only and explicitly dispatch full CI
        uses: actions/github-script@v9
        with:
          script: |
            const task = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/github.cjs');
            await task.publish({github,context,core,mode:'repair',
              verifiedPath:process.env.RUNNER_TEMP + '/task-verified.json'});

  notify-failure:
    needs: [repair, publish]
    if: >-
      always() && needs.repair.result != 'skipped' &&
      (needs.repair.result == 'failure' || needs.publish.result == 'failure')
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const {report} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/status.cjs');
            await report({github, context, phase:'repair-failure'});

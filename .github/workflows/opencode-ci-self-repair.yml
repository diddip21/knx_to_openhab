name: AI CI self-repair

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Exact dispatched CI run to continue'
        type: string
        required: true
      ci_run_attempt:
        description: 'Exact CI run attempt'
        type: string
        required: true
      ci_head_sha:
        description: 'Exact 40-character commit tested by CI'
        type: string
        required: true

permissions: {}
concurrency:
  group: ai-ci-repair-${{ github.event.workflow_run.head_sha || inputs.ci_head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
       (github.actor == github.repository_owner || github.actor == 'github-actions[bot]')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'ai/issue-'))
    permissions:
      contents: read
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      repair: ${{ steps.source.outputs.repair }}
      head_sha: ${{ steps.source.outputs.head_sha }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Wait for exact CI and dispatch software audit from trusted code
        id: source
        uses: actions/github-script@v9
        with:
          script: |
            const {routeContinuation} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/continuation.cjs');
            await routeContinuation({github, context, core});

  report:
    needs: route
    if: always() && needs.route.result != 'skipped'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          CONTINUATION_FAILED: ${{ needs.route.result != 'success' }}
        with:
          script: |
            const {resolveSource} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/continuation.cjs');
            const {report} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/status.cjs');
            let source = null;
            try { source = await resolveSource({github, context}); }
            catch { core.warning('The exact source could not be resolved; reporting only validated failure context.'); }
            await report({github, context, source, controller:true,
              phase:process.env.CONTINUATION_FAILED === 'true' ? 'continuation-failure' : undefined});

  repair:
    needs: route
    if: needs.route.outputs.repair == 'true'
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare isolated formatter runtime
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          python -I -m pip --isolated install --no-user "black==26.10.1" "isort==9.0.2"
          python -I -m isort --version-number
          python -I -m black --version
      - name: Read exact failing source without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.head_sha }}
          path: candidate
          persist-credentials: false
      - name: Require trusted runtime policy and unchanged CI
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:.opencode)" = "$(git -C ../trusted rev-parse HEAD:.opencode)"
          for file in opencode.json opencode.jsonc .github/workflows/ci.yml; do
            if test -e "../trusted/$file" || test -e "$file"; then
              cmp -s "../trusted/$file" "$file"
            fi
          done
      - name: Fetch actual run, PR and live authorization
        uses: actions/github-script@v9
        with:
          script: |
            const task = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/github.cjs');
            await task.fetchSource({github, context, directory:process.env.RUNNER_TEMP, mode:'repair'});
      - name: Read failed logs as untrusted diagnostic text
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.route.outputs.ci_run_id }}
        shell: bash
        run: |
          timeout 40s gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$RUNNER_TEMP/ci-failed.log" || true
      - name: Revalidate task, failing SHA, draft state and remaining repair budget
        working-directory: candidate
        run: python -I ../trusted/scripts/ci_repair.py prepare
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install pinned OpenCode
        run: npm install --global "@opencode/cli@$(cat trusted/.github/opencode-cli-version)"
      - name: Select approved free model
        id: model
        working-directory: candidate
        run: python ../trusted/scripts/opencode_model_router.py select --task repair --report "$RUNNER_TEMP/model.json"
      - name: Preserve content-free model selection diagnostics
        if: >-
          always() && (steps.model.outcome == 'success' ||
          steps.model.outcome == 'failure' || steps.model.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: ai-model-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model.json
          if-no-files-found: error
          retention-days: 3
      - name: Load literal permissions for existing approved files only
        working-directory: candidate
        run: python -I ../trusted/scripts/ci_repair.py agent
      - name: Generate bounded repair without GitHub credentials
        id: generation
        working-directory: candidate
        timeout-minutes: 18
        env:
          CI: "true"
          MODEL: ${{ steps.model.outputs.model }}
        shell: bash
        run: python -I ../trusted/scripts/automation/generation_runner.py --mode repair
      - name: Preserve content-free generation diagnostics
        if: >-
          always() && (steps.generation.outcome == 'success' ||
          steps.generation.outcome == 'failure' || steps.generation.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: ai-generation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generation-diagnostics.json
          if-no-files-found: error
          retention-days: 3
      - name: Restore runtime agent and validate repair
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- .opencode/agents/ai-task.md
          python -I ../trusted/scripts/ci_repair.py format
          python -I ../trusted/scripts/ci_repair.py collect
      - uses: actions/upload-artifact@v7
        with:
          name: ai-task-${{ github.run_id }}
          path: ${{ runner.temp }}/task-artifact.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [route, repair]
    outputs:
      ci_run_id: ${{ steps.publication.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.publication.outputs.ci_run_attempt }}
      ci_head_sha: ${{ steps.publication.outputs.ci_head_sha }}
      continuation_run_id: ${{ steps.publication.outputs.continuation_run_id }}
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Read failing Git objects only; never execute candidate code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.head_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ai-task-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Refresh actual run, current PR and live approval
        uses: actions/github-script@v9
        with:
          script: |
            const task = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/github.cjs');
            await task.fetchSource({github, context, directory:process.env.RUNNER_TEMP, mode:'repair'});
      - name: Independently validate content, scope, SHA and attempt
        working-directory: target
        run: python -I ../trusted/scripts/ci_repair.py recheck
      - name: Fast-forward only and explicitly dispatch full CI
        id: publication
        uses: actions/github-script@v9
        with:
          script: |
            const task = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/github.cjs');
            await task.publish({github,context,core,mode:'repair',
              verifiedPath:process.env.RUNNER_TEMP + '/task-verified.json'});

  notify-failure:
    needs: [repair, publish]
    if: >-
      always() && needs.repair.result != 'skipped' &&
      (needs.repair.result == 'failure' || needs.publish.result == 'failure')
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          RECOVERY_CI_RUN_ID: ${{ needs.publish.outputs.ci_run_id }}
          RECOVERY_CI_RUN_ATTEMPT: ${{ needs.publish.outputs.ci_run_attempt }}
          RECOVERY_CI_HEAD_SHA: ${{ needs.publish.outputs.ci_head_sha }}
          CONTINUATION_RUN_ID: ${{ needs.publish.outputs.continuation_run_id }}
        with:
          script: |
            const {resolveSource} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/continuation.cjs');
            const {report} = require(process.env.GITHUB_WORKSPACE + '/scripts/automation/status.cjs');
            let source = null;
            try { source = await resolveSource({github, context}); }
            catch { core.warning('The exact source could not be resolved; reporting only validated failure context.'); }
            const values = {ci_run_id:process.env.RECOVERY_CI_RUN_ID,
              ci_run_attempt:process.env.RECOVERY_CI_RUN_ATTEMPT,
              ci_head_sha:process.env.RECOVERY_CI_HEAD_SHA};
            const recovery = Object.values(values).every(Boolean) && !process.env.CONTINUATION_RUN_ID ? values : undefined;
            await report({github, context, source, recovery, controller:true, phase:'repair-failure'});

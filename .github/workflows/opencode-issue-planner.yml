name: OpenCode issue planner

on:
  issues:
    types: [labeled, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: ai-issue-plan-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      (
        (github.event_name == 'issues' &&
         ((github.actor == github.repository_owner &&
           github.event.action == 'labeled' &&
           github.event.label.name == 'ai:plan') ||
          (github.event.action == 'edited' &&
           contains(github.event.issue.labels.*.name, 'ai:approved'))) ||
        (github.event_name == 'issue_comment' &&
         github.actor == github.repository_owner)
      )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted default-branch controllers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout development source for planning
        uses: actions/checkout@v7
        with:
          ref: dev
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Require synchronized dev and trusted OpenCode policy
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$(git -C ../trusted rev-parse HEAD)" HEAD || {
            echo "::error::dev must contain current main before AI planning"
            exit 1
          }
          for file in opencode.jsonc .opencode/agents/issue-planner.md .opencode/agents/ci-smoke.md; do
            cmp -s "../trusted/$file" "$file" || {
              echo "::error::dev planner policy differs from trusted main: $file"
              exit 1
            }
          done

      - name: Fetch bot comments
        uses: actions/github-script@v9
        env:
          OUT_FILE: ${{ runner.temp }}/issue-comments.json
        with:
          script: |
            const fs = require('node:fs');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            fs.writeFileSync(process.env.OUT_FILE, JSON.stringify(comments));
            const {planningContext} = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/planning.cjs');
            const related = await planningContext({github, context,
              evidenceDirectory: process.env.GITHUB_WORKSPACE + '/candidate/.planner-evidence'});
            fs.writeFileSync(process.env.RUNNER_TEMP + '/planning-context.json', JSON.stringify(related));

      - name: Decide operation and prepare prompt
        id: decision
        working-directory: candidate
        shell: bash
        run: python ../trusted/scripts/issue_bot.py prepare

      - name: Invalidate the previous approval before replanning
        if: steps.decision.outputs.operation == 'plan'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const decision = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/issue-decision.json', 'utf8'));
            const {assertFreshPlanning} = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/planning.cjs');
            await assertFreshPlanning({github, context, snapshot: decision.planning_snapshot});
            const repo = {owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number};
            const {data: issue} = await github.rest.issues.get(repo);
            const labels = new Set(issue.labels.map(x => x.name));
            const digest = crypto.createHash('sha256')
              .update(JSON.stringify([issue.title ?? '', issue.body ?? '']), 'utf8').digest('hex');
            if (issue.state !== 'open' || issue.pull_request || !labels.has('ai:plan') || digest !== decision.digest) {
              throw new Error('Issue changed before planning; refusing to reuse old approval');
            }
            if (labels.has('ai:approved')) {
              await github.rest.issues.removeLabel({...repo, name: 'ai:approved'});
            }
            if (!labels.has('ai:waiting')) {
              await github.rest.issues.addLabels({...repo, labels: ['ai:waiting']});
            }

      - name: Set up Node.js
        if: steps.decision.outputs.operation == 'plan'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install OpenCode
        if: steps.decision.outputs.operation == 'plan'
        run: |
          npm install --global "@opencode/cli@$(cat trusted/.github/opencode-cli-version)"
          opencode --version

      - name: Select an approved working free model
        id: model
        if: steps.decision.outputs.operation == 'plan'
        working-directory: candidate
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/planner-data
        run: |
          set -euo pipefail
          python ../trusted/scripts/opencode_model_router.py select --task plan --report "$RUNNER_TEMP/model-router.json"

      - name: Preserve content-free model selection diagnostics
        if: >-
          always() && (steps.model.outcome == 'success' ||
          steps.model.outcome == 'failure' || steps.model.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: ai-model-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-router.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate plan with selected free model
        if: steps.decision.outputs.operation == 'plan'
        working-directory: candidate
        shell: bash
        env:
          MODEL: ${{ steps.model.outputs.model }}
          CI: "true"
          XDG_DATA_HOME: ${{ runner.temp }}/planner-data
        run: |
          set -euo pipefail
          python -I ../trusted/scripts/automation/planner_runner.py

      - name: Retain content-free planner diagnostics
        if: always() && steps.decision.outputs.operation == 'plan'
        uses: actions/upload-artifact@v7
        with:
          name: ai-planner-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/planner-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish plan, questions or approval
        if: >-
          steps.decision.outputs.operation == 'plan' ||
          steps.decision.outputs.operation == 'approve' ||
          steps.decision.outputs.operation == 'invalidate' ||
          steps.decision.outputs.operation == 'notice'
        uses: actions/github-script@v9
        env:
          RESULT_FILE: ${{ runner.temp }}/issue-result.json
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'));
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const issue_number = result.issue;
            const details = await github.rest.issues.get({ ...repo, issue_number });
            if (details.data.state !== 'open' || details.data.pull_request) {
              core.setFailed('Issue closed or converted to PR during processing');
              return;
            }
            const labels = new Set(details.data.labels.map(x => x.name));
            if (result.operation !== 'invalidate' && !labels.has('ai:plan')) {
              core.setFailed('ai:plan label removed while processing');
              return;
            }
            let liveDigest;
            if (['approve', 'invalidate', 'plan'].includes(result.operation)) {
              liveDigest = crypto.createHash('sha256')
                .update(JSON.stringify([details.data.title ?? '', details.data.body ?? '']), 'utf8')
                .digest('hex');
              if (!result.digest || liveDigest !== result.digest) {
                core.setFailed('Issue title or body changed while processing; rerun the plan or approval against the current issue.');
                return;
              }
            }
            if (result.operation === 'approve') {
              const {assertFreshPlanning} = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/planning.cjs');
              await assertFreshPlanning({github, context, snapshot: result.planning_snapshot, approval: true});
              if (!labels.has('ai:waiting')) {
                core.setFailed('Approval no longer awaiting human review');
                return;
              }
              await github.rest.issues.addLabels({
                ...repo, issue_number, labels: ['ai:approved']
              });
              await github.rest.issues.removeLabel({
                ...repo, issue_number, name: 'ai:waiting'
              });
            } else if (result.operation === 'plan') {
              const {assertFreshPlanning} = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/planning.cjs');
              await assertFreshPlanning({github, context, snapshot: result.planning_snapshot});
              await github.rest.issues.createComment({
                ...repo, issue_number, body: result.comment
              });
              await github.rest.issues.addLabels({
                ...repo, issue_number, labels: ['ai:waiting']
              });
              if (labels.has('ai:approved')) {
                await github.rest.issues.removeLabel({
                  ...repo, issue_number, name: 'ai:approved'
                });
              }
              return;
            } else if (result.operation === 'invalidate') {
              if (!labels.has('ai:approved') || liveDigest === result.approved_digest) {
                core.info('The approved state changed while processing; keeping current labels.');
                return;
              }
              await github.rest.issues.removeLabel({
                ...repo, issue_number, name: 'ai:approved'
              });
              if (labels.has('ai:plan') && !labels.has('ai:waiting')) {
                await github.rest.issues.addLabels({
                  ...repo, issue_number, labels: ['ai:waiting']
                });
              }
              await github.rest.issues.createComment({
                ...repo, issue_number, body: result.comment
              });
              return;
            }
            await github.rest.issues.createComment({
              ...repo, issue_number, body: result.comment
            });

      - name: Explain model failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const {report} = require(process.env.GITHUB_WORKSPACE + '/trusted/scripts/automation/status.cjs');
            await report({github, context, phase:'planning-failure'});

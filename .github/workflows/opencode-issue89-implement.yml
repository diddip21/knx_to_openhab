name: OpenCode approved HomeKit issue 89 implementation

on:
  issue_comment:
    types: [created]

concurrency:
  group: ai-implement-89-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      github.actor == github.repository_owner &&
      github.event.issue.number == 89 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ai implement v')
    permissions:
      contents: read
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted default-branch validators
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout development source branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Require dev to contain main and match trusted OpenCode policies
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$(git -C ../trusted rev-parse HEAD)" HEAD || {
            echo "::error::dev does not contain main: reconcile dev first"
            exit 1
          }
          for file in opencode.jsonc .opencode/agents/issue89-implementer.md .opencode/agents/ci-smoke.md .github/workflows/ci.yml; do
            cmp -s "../trusted/$file" "$file" || {
              echo "::error::dev OpenCode policy differs from trusted main: $file"
              exit 1
            }
          done

      - name: Fetch live issue and all comments
        uses: actions/github-script@v9
        env:
          OUT: ${{ runner.temp }}
        with:
          script: |
            const fs = require('node:fs');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const issue_number = context.issue.number;
            const {data: issue} = await github.rest.issues.get({...repo, issue_number});
            const comments = await github.paginate(github.rest.issues.listComments,
              {...repo, issue_number, per_page: 100});
            fs.writeFileSync(process.env.OUT + '/issue-current.json', JSON.stringify(issue));
            fs.writeFileSync(process.env.OUT + '/issue-comments.json', JSON.stringify(comments));

      - name: Verify owner approval and plan version
        working-directory: candidate
        run: python ../trusted/scripts/issue89_impl.py prepare

      - name: Install OpenCode for isolated runner
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install OpenCode CLI
        run: |
          npm install --global @opencode/cli
          opencode --version

      - name: Find best working approved free model
        id: model
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python ../trusted/scripts/opencode_model_router.py select --task implement --report "$RUNNER_TEMP/issue89-model.json"

      - name: Implement approved HomeKit changes in limited workspace
        working-directory: candidate
        shell: bash
        env:
          CI: "true"
          MODEL: ${{ steps.model.outputs.model }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 1150s \
            opencode run --standalone --archived --format json \
              --agent issue89-implementer --model "$MODEL" \
              "$(cat "$RUNNER_TEMP/issue89-prompt.txt")" \
            < /dev/null > "$RUNNER_TEMP/issue89-events.jsonl" \
            2> "$RUNNER_TEMP/issue89-stderr.log"

      - name: Validate exact changed file set and build candidate artifact
        working-directory: candidate
        run: python ../trusted/scripts/issue89_impl.py collect

      - name: Upload bounded code candidate only
        uses: actions/upload-artifact@v4
        with:
          name: approved-issue89-${{ github.run_id }}
          path: ${{ runner.temp }}/issue89-artifact.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: implement
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout trusted default-branch validators
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout current development base
        uses: actions/checkout@v4
        with:
          ref: dev
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Require dev base to contain current main
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$(git -C ../trusted rev-parse HEAD)" HEAD || {
            echo "::error::dev does not contain main at publishing time"
            exit 1
          }

      - name: Require approved CI definition for the development base
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          cmp -s ../trusted/.github/workflows/ci.yml .github/workflows/ci.yml || {
            echo "::error::dev CI definition differs from trusted main; review before publishing"
            exit 1
          }

      - name: Download validated candidate
        uses: actions/download-artifact@v4
        with:
          name: approved-issue89-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Re-fetch issue and approval comments
        uses: actions/github-script@v9
        env:
          OUT: ${{ runner.temp }}
        with:
          script: |
            const fs = require('node:fs');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const issue_number = context.issue.number;
            const {data: issue} = await github.rest.issues.get({...repo, issue_number});
            const comments = await github.paginate(github.rest.issues.listComments,
              {...repo, issue_number, per_page: 100});
            fs.writeFileSync(process.env.OUT + '/issue-current.json', JSON.stringify(issue));
            fs.writeFileSync(process.env.OUT + '/issue-comments.json', JSON.stringify(comments));

      - name: Revalidate current plan approval and every candidate file
        working-directory: target
        run: python ../trusted/scripts/issue89_impl.py recheck

      - name: Open Draft PR with approved changes only
        uses: actions/github-script@v9
        env:
          ARTIFACT: ${{ runner.temp }}/issue89-artifact.json
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const item = JSON.parse(fs.readFileSync(process.env.ARTIFACT, 'utf8'));
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const version = item.version;
            const head = `ai/issue-89-plan-v${version}-run-${context.runId}`;
            const prefix = `ai/issue-89-plan-v${version}-run-`;

            if (item.issue_number !== 89 || !Number.isSafeInteger(version) ||
                item.files.length < 6 || item.files.length > 18) {
              core.setFailed('Artifact issue, version or file count is invalid');
              return;
            }

            // No duplicate implementation PR for the same approved plan.
            const {data: openPrs} = await github.rest.pulls.list({
              ...repo, state: 'open', per_page: 100
            });
            const existing = openPrs.find(pr =>
              pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
              pr.head.ref.startsWith(prefix));
            if (existing) {
              core.info(`Existing issue-89 PR: ${existing.html_url}`);
              return;
            }

            // Recheck dev and default-branch ancestry before writing.
            const {data: dev} = await github.rest.repos.getBranch({
              ...repo, branch: 'dev'
            });
            if (dev.commit.sha !== item.base_commit_sha) {
              core.setFailed('dev changed since the AI candidate was validated');
              return;
            }
            const {data: comparison} = await github.rest.repos.compareCommits({
              ...repo, base: context.payload.repository.default_branch, head: 'dev'
            });
            if (comparison.behind_by !== 0) {
              core.setFailed('dev must contain all current main commits');
              return;
            }
            const {data: issue} = await github.rest.issues.get({...repo, issue_number: 89});
            const labels = new Set(issue.labels.map(label => label.name));
            const currentDigest = crypto.createHash('sha256')
              .update(JSON.stringify([issue.title ?? '', issue.body ?? '']), 'utf8')
              .digest('hex');
            if (issue.state !== 'open' || !labels.has('ai:approved') ||
                !labels.has('ai:plan') || labels.has('ai:waiting') ||
                currentDigest !== item.digest) {
              core.setFailed('Approved requirements have changed');
              return;
            }

            // Defense in depth: the privileged publisher accepts explicit paths
            // only and never executes the candidate code.
            const allowed = new Set([
              'config.json', 'knxproject_to_openhab.py', 'ets_to_openhab.py',
              'web_ui/backend/jobs.py', 'web_ui/backend/project_preview.py',
              'web_ui/backend/app.py', 'web_ui/templates/index.html',
              'web_ui/static/app.js', 'web_ui/static/i18n.js', 'web_ui/api_schema.json',
              'tests/test_rollershutter_homekit_extents.py',
              'tests/test_homekit_config_override.py',
              'tests/ui/test_homekit_settings.py', 'docs/USER_GUIDE.md',
              'README.md', 'CHANGELOG.md'
            ]);
            const paths = item.files.map(file => file.path);
            if (new Set(paths).size !== paths.length || !paths.every(path => allowed.has(path))) {
              core.setFailed('File allowlist violation');
              return;
            }
            const treeEntries = [];
            for (const file of item.files) {
              const bytes = Buffer.from(file.content_b64, 'base64');
              const digest = crypto.createHash('sha256').update(bytes).digest('hex');
              if (digest !== file.sha256 || bytes.length > 300000) {
                core.setFailed(`File digest or size check failed: ${file.path}`);
                return;
              }
              const {data: blob} = await github.rest.git.createBlob({
                ...repo, content: file.content_b64, encoding: 'base64'
              });
              treeEntries.push({path: file.path, mode: '100644', type: 'blob', sha: blob.sha});
            }

            const {data: baseCommit} = await github.rest.git.getCommit({
              ...repo, commit_sha: item.base_commit_sha
            });
            const {data: tree} = await github.rest.git.createTree({
              ...repo, base_tree: baseCommit.tree.sha, tree: treeEntries
            });
            const {data: commit} = await github.rest.git.createCommit({
              ...repo,
              message: 'feat(homekit): apply approved blind extents plan (refs #89)',
              tree: tree.sha,
              parents: [item.base_commit_sha]
            });
            await github.rest.git.createRef({
              ...repo, ref: `refs/heads/${head}`, sha: commit.sha
            });
            const {data: pr} = await github.rest.pulls.create({
              ...repo,
              title: 'feat(homekit): implement approved blind extents settings (#89)',
              head, base: 'dev', draft: true,
              body: `Implements owner-approved issue #89 plan v${version}.\n\n` +
                `Automated OpenCode/Superpowers candidate, based on dev; changed paths validated against an issue-specific allowlist.\n` +
                `**Review required:** group vs item metadata scope, CLI/Web UI default, saved false, translation, regression tests, UI screenshots, and hardware behavior.\n` +
                `The actual KNX actuator has NOT been verified by CI. No auto-merge.\n\n` +
                `Approval comment: ${item.approval_comment_id}; implementation command: ${item.command_comment_id}.\n\n` +
                `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.info(`Draft PR: ${pr.html_url}`);
            core.summary.addRaw(`Draft PR: ${pr.html_url}`).write();

            // GITHUB_TOKEN-created PRs do not automatically trigger CI.
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: 'ci.yml', ref: head
            });
            core.info('Explicit CI workflow dispatch completed');

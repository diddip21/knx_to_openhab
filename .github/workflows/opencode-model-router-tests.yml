name: OpenCode free-model router tests

on:
  pull_request:
    paths:
      - "scripts/opencode_model_router.py"
      - "tests/test_opencode_model_router.py"
      - ".github/workflows/opencode-model-router-tests.yml"
      - ".github/workflows/opencode-issue-planner.yml"
      - ".github/workflows/opencode-issue-implement.yml"
      - "docs/OPENCODE_MODEL_ROUTER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install unit test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Test allowlist, probe scoring and failure paths
        run: python -m pytest tests/test_opencode_model_router.py -q -o addopts=
      - name: Check Python syntax
        run: python -m py_compile scripts/opencode_model_router.py

  live-probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        task: [plan, implement]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OpenCode
        run: npm install --global @opencode/cli
      - name: Select free model using read-only live probes
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/opencode_model_router.py select --task "${{ matrix.task }}" --report "$RUNNER_TEMP/model-router.json"; then
            python -c 'import json,os; data=json.load(open(os.environ["RUNNER_TEMP"]+"/model-router.json")); assert data["selected"] in ("opencode/glm-5.3-flash-free","opencode/deepseek-v4.1-flash-free")'
          else
            echo "Free-model selection diagnostics (no prompts, tokens or secrets):"
            cat "$RUNNER_TEMP/model-router.json"
            exit 1
          fi
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-router-${{ matrix.task }}
          path: ${{ runner.temp }}/model-router.json
          if-no-files-found: ignore

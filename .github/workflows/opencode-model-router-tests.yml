name: OpenCode free-model router tests

on:
  pull_request:
    paths:
      - "scripts/opencode_model_router.py"
      - "scripts/automation/task_probe.py"
      - ".opencode/agents/ci-smoke.md"
      - ".github/opencode-cli-version"
      - "tests/test_opencode_model_router.py"
      - "tests/test_model_task_probe.py"
      - "scripts/automation/provider_policy.py"
      - "scripts/automation/free_providers.py"
      - "scripts/automation/provider_contract.py"
      - "tests/test_free_providers.py"
      - ".github/workflows/opencode-model-router-tests.yml"
      - ".github/workflows/opencode-issue-planner.yml"
      - ".github/workflows/ai-issue-implement.yml"
      - ".github/workflows/opencode-ci-self-repair.yml"
      - "docs/OPENCODE_MODEL_ROUTER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-research:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner && vars.AI_PLANNER_DIAGNOSTIC_ISSUE != ''
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/ai-planner-live-tests.yml
    with:
      issue_number: ${{ vars.AI_PLANNER_DIAGNOSTIC_ISSUE }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install unit test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Test allowlist, probe scoring and failure paths
        run: python -m pytest tests/test_opencode_model_router.py tests/test_model_task_probe.py tests/test_free_providers.py -q -o addopts=
      - name: Check Python syntax
        run: python -m py_compile scripts/opencode_model_router.py

  live-probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        task: [plan, implement, repair]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install OpenCode
        run: npm install --global "@opencode/cli@$(cat .github/opencode-cli-version)"
      - name: Verify actual zero-price HTTP request against local test server
        run: python -I scripts/automation/provider_contract.py
      - name: Select free model using read-only live probes
        id: model
        env:
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_dispatch' && vars.AI_PLANNER_DIAGNOSTIC_ISSUE == '' && secrets.OPENROUTER_API_KEY || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/opencode_model_router.py select --task "${{ matrix.task }}" --report "$RUNNER_TEMP/model-router.json"; then
            PYTHONPATH=scripts python -c 'import json,os; from opencode_model_router import ALL_APPROVED_MODELS; data=json.load(open(os.environ["RUNNER_TEMP"]+"/model-router.json")); assert data["selected"] in ALL_APPROVED_MODELS'
          else
            echo "Free-model selection diagnostics (no prompts, tokens or secrets):"
            cat "$RUNNER_TEMP/model-router.json"
            exit 1
          fi
      - name: Upload probe report
        if: >-
          always() && (steps.model.outcome == 'success' ||
          steps.model.outcome == 'failure' || steps.model.outcome == 'cancelled')
        uses: actions/upload-artifact@v7
        with:
          name: model-router-${{ matrix.task }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-router.json
          if-no-files-found: error

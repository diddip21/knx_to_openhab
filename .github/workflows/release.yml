name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build deterministic archive and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/build_release.py --version "$version" --output-dir dist

      - name: Determine release channel
        id: channel
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_without_build_metadata="${version%%+*}"
          if [[ "$version_without_build_metadata" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.channel.outputs.prerelease == 'true' }}

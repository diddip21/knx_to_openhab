<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in · KNX to OpenHAB</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" type="image/png" href="/static/favicon.png">
</head>

<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <img src="/static/favicon.png" alt="">
      <span>LogiKNX2HAB</span>
    </div>
    <h1>Sign in</h1>
    <p class="login-intro">Enter your Web UI credentials to continue.</p>

    {% if error %}
    <p class="login-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login', next=next_url) }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn-primary login-submit" type="submit">Sign in</button>
    </form>
  </main>
</body>

</html>
